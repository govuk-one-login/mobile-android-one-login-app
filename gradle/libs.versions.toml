# Security patches
# Transitive netty constraints (via AGP Unified Test Platform / grpc-netty; not on the app
# runtime classpath). Declared as the full set of flagged modules so the group stays
# version-aligned, raised to a patched version to clear Dependabot CVEs.
patch-netty-handler = { group = "io.netty", name = "netty-handler", version.ref = "netty" }
patch-netty-handler-proxy = { group = "io.netty", name = "netty-handler-proxy", version.ref = "netty" }
patch-netty-common = { group = "io.netty", name = "netty-common", version.ref = "netty" }
patch-netty-codec = { group = "io.netty", name = "netty-codec", version.ref = "netty" }
patch-netty-codec-http = { group = "io.netty", name = "netty-codec-http", version.ref = "netty" }
patch-netty-codec-http2 = { group = "io.netty", name = "netty-codec-http2", version.ref = "netty" }
# Transitive constraints for build/test tooling (not on the app runtime classpath),
# raised to patched versions to clear Dependabot CVEs.
patch-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
patch-guava-jvm = { group = "com.google.guava", name = "guava", version.ref = "guavaJvm" }
patch-commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
patch-commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
patch-httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "httpclient" }
patch-logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logbackCore" }

[bundles]
cri-orchestrator-bundle = ["uk-gov-idcheck-hilt-config", "cri-orchestrator-dev"]
# Transitive netty modules flagged by Dependabot, updated as a group for security patching.
tooling-security-netty = [
  "patch-netty-handler",
  "patch-netty-handler-proxy",
  "patch-netty-common",
  "patch-netty-codec",
  "patch-netty-codec-http",
  "patch-netty-codec-http2",
]
# Transitive build/test tooling dependencies flagged by Dependabot, updated for security.
tooling-security-other = [
  "patch-guava",
  "patch-commons-compress",
  "patch-commons-lang3",
  "patch-httpclient",
  "patch-logback-core",
]
firebase = [
  "firebase-appcheck",
  "firebase-appcheck-debug",
  "firebase-analytics",
  "firebase-crashlytics",
]
gov-uk = [
  "componentsv2",
  "patterns",
  "theme",
  "authentication",
  "secure-store",
  "network",
  "logging-impl",
  "cri-orchestrator",
  "localauth",
   "authentication-json"
]
about-libraries = [
  "aboutlibraries-core",
  "aboutlibraries-compose-core",
  "aboutlibraries-compose-m3",
]
