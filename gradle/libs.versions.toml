guava = "33.7.2-android" # CVE-2026-102554 etc.
guavaJvm = "33.7.2-jre" # GHSA-xxph-c9ww-hj94 — JVM flavour for the build/plugin classpath
commonsCompress = "1.27.1" # CVE-2024-25710 / CVE-2024-26308
commonsLang3 = "3.18.0" # CVE-2025-48924
httpclient = "4.5.14" # CVE-2020-13956
logbackCore = "1.5.34" # CVE-2026-1225 / 9828 / 10532

